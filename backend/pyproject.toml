[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harbor-transfer-portal-backend"
dynamic = ["version"]
description = "Backend API for Harbor Transfer Portal"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2.0",
  "argon2-cffi>=25.1,<26.0",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "jsonschema>=4.25,<5.0",
  "pydantic-settings>=2.10,<3.0",
  "PyJWT>=2.10,<3.0",
  "PyYAML>=6.0,<7.0",
  "reportlab>=4.4,<5.0",
  "sqlalchemy>=2.0.43,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.scripts]
htp-bootstrap-admin = "app.auth.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2.0",
  "pypdf>=6.0,<7.0",
  "pytest>=8.4,<9.0",
  "pytest-cov>=6.2,<7.0",
  "ruff>=0.12,<1.0",
  "types-jsonschema>=4.25,<5.0",
  "types-PyYAML>=6.0,<7.0",
  "types-reportlab>=4.4,<5.0",
]

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = true
no_implicit_optional = true
local_partial_types = true
allow_redefinition_new = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true
