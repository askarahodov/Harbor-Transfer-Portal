name: harbor-transfer-portal

services:
  backend:
    image: harbor-transfer-portal-backend:${PORTAL_VERSION}
    pull_policy: never
    network_mode: host
    env_file:
      - .env
    environment:
      PORTAL_CONTOUR: ${PORTAL_CONTOUR:-SOURCE}
    command:
      - uvicorn
      - app.main:app
      - --host
      - 127.0.0.1
      - --port
      - "8000"
    volumes:
      - portal-data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "${PORTAL_LOG_MAX_SIZE:-10m}"
        max-file: "${PORTAL_LOG_MAX_FILES:-5}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  frontend:
    image: harbor-transfer-portal-frontend:${PORTAL_VERSION}
    pull_policy: never
    network_mode: host
    environment:
      PORTAL_CONTOUR: ${PORTAL_CONTOUR:-SOURCE}
      PORTAL_HTTP_BIND: ${PORTAL_HTTP_BIND:-127.0.0.1}
      PORTAL_HTTP_PORT: ${PORTAL_HTTP_PORT:-8080}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "${PORTAL_LOG_MAX_SIZE:-10m}"
        max-file: "${PORTAL_LOG_MAX_FILES:-5}"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://$${PORTAL_HTTP_BIND}:$${PORTAL_HTTP_PORT}/healthz"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  portal-data:
