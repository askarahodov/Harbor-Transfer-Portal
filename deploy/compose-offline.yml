name: harbor-transfer-portal

services:
  backend:
    image: harbor-transfer-portal-backend:${PORTAL_VERSION:?PORTAL_VERSION must be set}
    pull_policy: never
    env_file:
      - .env
    environment:
      PORTAL_CONTOUR: ${PORTAL_CONTOUR:?PORTAL_CONTOUR must be set}
    volumes:
      - portal-data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "${PORTAL_LOG_MAX_SIZE:-10m}"
        max-file: "${PORTAL_LOG_MAX_FILES:-5}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  frontend:
    image: harbor-transfer-portal-frontend:${PORTAL_VERSION:?PORTAL_VERSION must be set}
    pull_policy: never
    environment:
      PORTAL_CONTOUR: ${PORTAL_CONTOUR:?PORTAL_CONTOUR must be set}
    ports:
      - "${PORTAL_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "${PORTAL_LOG_MAX_SIZE:-10m}"
        max-file: "${PORTAL_LOG_MAX_FILES:-5}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  portal-data:
