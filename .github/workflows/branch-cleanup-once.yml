name: One-time audited branch cleanup (#513)

# Safe to run as a PR dry-run. A main push that includes this new workflow
# and passes the live re-audit may delete only pinned, validated refs.
on:
  pull_request:
    paths:
      - .github/workflows/branch-cleanup-once.yml
      - tools/prune_branch_refs.py
      - tools/branch-prune-candidates.tsv
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-cleanup-once.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: audited-branch-cleanup-513
  cancel-in-progress: false

jobs:
  audit-and-prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Check script syntax
        run: python3 -m py_compile tools/prune_branch_refs.py

      - name: Verify every branch and PR without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/prune_branch_refs.py

      - name: Delete only the 188 reviewed and unchanged refs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_PRUNE_ENABLE: issue-513-reviewed-188
        run: python3 tools/prune_branch_refs.py --apply

      - name: Write summary
        if: always()
        shell: bash
        run: |
          echo "Branch cleanup issue: #513" >> "$GITHUB_STEP_SUMMARY"
          echo "Manifest: 180 directly merged into main, 8 contained, 20 Nexus-only refs excluded." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "PR run: dry-run only; no refs deleted." >> "$GITHUB_STEP_SUMMARY"
          fi
