name: One-time cleanup of two fully superseded merged-history refs (#513)

on:
  pull_request:
    paths:
      - .github/workflows/prune-two-merged-history-aliases-once.yml
      - tools/prune_two_merged_history_aliases.py
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-two-merged-history-aliases-once.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: issue-513-two-merged-history-aliases
  cancel-in-progress: false

jobs:
  safe-prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Verify script syntax
        run: python3 -m py_compile tools/prune_two_merged_history_aliases.py

      - name: Preflight exact branch deltas and merged replacement PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/prune_two_merged_history_aliases.py

      - name: Delete only after approved merge into main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_PRUNE_ENABLE: issue-513-two-merged-history-aliases
        run: python3 tools/prune_two_merged_history_aliases.py --apply

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "Issue #513 — two branch refs whose post-merge history is fully covered by merged PRs" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "PR dry-run only; no refs deleted." >> "$GITHUB_STEP_SUMMARY"
          fi
