name: Publish prebuilt images to GHCR

# Publish only source code already accepted by CI on the default branch.
# No images are pushed for untrusted pull-request heads.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish backend and frontend (linux/amd64)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exactly the CI-tested commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Determine and verify release identity
        id: release
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          version="$(sed -n 's/^__version__ = "\([A-Za-z0-9._-][A-Za-z0-9._-]*\)"$/\1/p' backend/app/__init__.py)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/harbor-transfer-portal-backend:sha-${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            RELEASE_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.event.workflow_run.head_sha }}

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/harbor-transfer-portal-frontend:sha-${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            RELEASE_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.event.workflow_run.head_sha }}

      - name: Summarize immutable release identity
        shell: bash
        run: |
          echo "Published GHCR images from CI-tested commit:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend: sha-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: sha-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Architecture: linux/amd64" >> "$GITHUB_STEP_SUMMARY"
          echo "Package visibility defaults to private. Configure read access or make the packages public separately." >> "$GITHUB_STEP_SUMMARY"
