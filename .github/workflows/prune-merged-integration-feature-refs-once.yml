name: One-time cleanup of merged Nexus integration feature refs

on:
  pull_request:
    paths:
      - .github/workflows/prune-merged-integration-feature-refs-once.yml
      - tools/prune_merged_integration_feature_refs_once.py
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-merged-integration-feature-refs-once.yml
      - tools/prune_merged_integration_feature_refs_once.py

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: issue-513-retire-merged-integration-feature-refs
  cancel-in-progress: false

jobs:
  safe-prune:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Verify script syntax
        run: python3 -m py_compile tools/prune_merged_integration_feature_refs_once.py

      - name: Audit merged PRs and dry-run the atomic ref transaction
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/prune_merged_integration_feature_refs_once.py

      - name: Delete only exact merged refs and this cleanup ref
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_PRUNE_ENABLE: issue-513-retire-merged-integration-refs
        run: python3 tools/prune_merged_integration_feature_refs_once.py --apply

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "Retire 19 merged feature/sync refs; keep the Nexus integration branch and open PR #503." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "PR run: atomic CAS dry-run only; no refs deleted." >> "$GITHUB_STEP_SUMMARY"
          fi
