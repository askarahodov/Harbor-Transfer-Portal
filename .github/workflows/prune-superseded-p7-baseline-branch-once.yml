name: One-time cleanup of superseded P7.3 baseline snapshot branch (#513)

on:
  pull_request:
    paths:
      - .github/workflows/prune-superseded-p7-baseline-branch-once.yml
      - tools/prune_superseded_p7_baseline_branch_once.py
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-superseded-p7-baseline-branch-once.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: issue-513-p7-baseline-snapshot
  cancel-in-progress: false

jobs:
  safe-prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Verify script syntax
        run: python3 -m py_compile tools/prune_superseded_p7_baseline_branch_once.py

      - name: Preflight exact ref, merged CI baseline and all current-main replacements
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/prune_superseded_p7_baseline_branch_once.py

      - name: Delete only after approved merge into main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_PRUNE_ENABLE: issue-513-p7-baseline-snapshot
        run: python3 tools/prune_superseded_p7_baseline_branch_once.py --apply

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "Issue #513 — superseded P7.3 application baseline snapshot" >> "$GITHUB_STEP_SUMMARY"
          echo "Issue #26 remains open; this ref cleanup does not close it." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "PR dry-run only; no refs deleted." >> "$GITHUB_STEP_SUMMARY"
          fi
