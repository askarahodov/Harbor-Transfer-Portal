name: One-time cleanup of merged Issue #513 handoff refs

on:
  pull_request:
    paths:
      - .github/workflows/prune-513-cleanup-handoff-refs-once.yml
      - tools/prune_513_cleanup_handoff_refs_once.py
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-513-cleanup-handoff-refs-once.yml
      - tools/prune_513_cleanup_handoff_refs_once.py

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: issue-513-retire-merged-handoff-refs
  cancel-in-progress: false

jobs:
  safe-prune:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Verify script syntax
        run: python3 -m py_compile tools/prune_513_cleanup_handoff_refs_once.py

      - name: Audit exact refs and run atomic compare-and-swap dry-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/prune_513_cleanup_handoff_refs_once.py

      - name: Delete only exact merged handoff refs and this cleanup ref
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_PRUNE_ENABLE: issue-513-retire-handoff-refs
        run: python3 tools/prune_513_cleanup_handoff_refs_once.py --apply

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "Issue #513 — retire only the three verified cleanup handoff refs" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "PR run: atomic CAS dry-run only; no refs deleted." >> "$GITHUB_STEP_SUMMARY"
          fi
