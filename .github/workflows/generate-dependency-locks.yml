name: Generate dependency locks (temporary)

on:
  pull_request:
    paths:
      - '.github/workflows/generate-dependency-locks.yml'

permissions:
  contents: write

jobs:
  generate:
    name: Generate and commit reproducible dependency locks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Generate backend runtime lock
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .lock-runtime
          .lock-runtime/bin/python -m pip install hatchling
          .lock-runtime/bin/python -m pip install -e ./backend
          .lock-runtime/bin/python -m pip freeze --exclude-editable | LC_ALL=C sort > backend/requirements-runtime.lock
          test -s backend/requirements-runtime.lock

      - name: Generate backend CI/dev lock
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .lock-dev
          .lock-dev/bin/python -m pip install hatchling
          .lock-dev/bin/python -m pip install -e './backend[dev]'
          .lock-dev/bin/python -m pip freeze --exclude-editable | LC_ALL=C sort > backend/requirements-dev.lock
          test -s backend/requirements-dev.lock

      - name: Generate frontend npm lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfiles to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/requirements-runtime.lock backend/requirements-dev.lock frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfiles are already current.'
            exit 0
          fi
          git commit -m 'chore: зафиксировать dependency locks'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
