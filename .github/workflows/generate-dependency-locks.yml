name: Generate dependency locks (temporary)

on:
  pull_request:
    paths:
      - '.github/workflows/generate-dependency-locks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate reproducible dependency locks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Generate backend runtime lock
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .lock-runtime
          .lock-runtime/bin/python -m pip install hatchling
          .lock-runtime/bin/python -m pip install -e ./backend
          .lock-runtime/bin/python -m pip freeze --exclude-editable | LC_ALL=C sort > backend/requirements-runtime.lock
          test -s backend/requirements-runtime.lock

      - name: Generate backend CI/dev lock
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .lock-dev
          .lock-dev/bin/python -m pip install hatchling
          .lock-dev/bin/python -m pip install -e './backend[dev]'
          .lock-dev/bin/python -m pip freeze --exclude-editable | LC_ALL=C sort > backend/requirements-dev.lock
          test -s backend/requirements-dev.lock

      - name: Generate frontend npm lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Stage generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/backend generated/frontend
          cp backend/requirements-runtime.lock generated/backend/
          cp backend/requirements-dev.lock generated/backend/
          cp frontend/package-lock.json generated/frontend/
          sha256sum generated/backend/* generated/frontend/* > generated/SHA256SUMS

      - name: Upload generated locks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-locks
          path: generated
          if-no-files-found: error
          retention-days: 1
