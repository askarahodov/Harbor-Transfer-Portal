name: Branch inventory audit tests

# Read-only branch inventory helper for issue #513. The tool only reports remote
# refs and never mutates them, so this workflow runs its offline unit tests on
# the changed files instead of widening the main CI matrix.
on:
  pull_request:
    paths:
      - tools/branch_inventory_audit.py
      - tools/test_branch_inventory_audit.py
      - tools/branch-inventory-audit.tsv

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Test branch inventory classification and output stability
        run: python3 -m unittest tools.test_branch_inventory_audit -v