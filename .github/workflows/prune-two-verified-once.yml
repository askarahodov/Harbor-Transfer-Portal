name: Verified two-branch cleanup (#513)

on:
  pull_request:
    paths:
      - .github/workflows/prune-two-verified-once.yml
      - tools/prune_two_verified_refs.py
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-two-verified-once.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: issue-513-two-verified-refs
  cancel-in-progress: false

jobs:
  safe-prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify script parses
        run: python3 -m py_compile tools/prune_two_verified_refs.py
      - name: Preflight - all refs and merged PR provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/prune_two_verified_refs.py
      - name: Delete only after approved merge into main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_PRUNE_ENABLE: issue-513-two-proven-refs
        run: python3 tools/prune_two_verified_refs.py --apply
