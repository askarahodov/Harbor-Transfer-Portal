name: Final audited branch cleanup (#513)

on:
  pull_request:
    paths:
      - .github/workflows/prune-final-once.yml
      - tools/final-ref-prune.tsv
      - tools/prune_final_refs.py
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-final-once.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: final-audited-branch-cleanup-513
  cancel-in-progress: false

jobs:
  audit-and-prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Syntax preflight
        run: python3 -m py_compile tools/prune_final_refs.py
      - name: Audit every pinned ref and PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/prune_final_refs.py
      - name: Apply final 10 + own merged cleanup branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_PRUNE_ENABLE: issue-513-final-10-self
        run: python3 tools/prune_final_refs.py --apply
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "Issue #513 — final 10 pinned refs and the cleanup PR's own branch" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "PR dry-run: no refs deleted." >> "$GITHUB_STEP_SUMMARY"
          fi
