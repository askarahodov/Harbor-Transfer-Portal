name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Определение области изменений
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      protocol: ${{ steps.scope.outputs.protocol }}
      security: ${{ steps.scope.outputs.security }}
      integration: ${{ steps.scope.outputs.integration }}
      compose: ${{ steps.scope.outputs.compose }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          clean: true

      - name: Проверить regression scoped CI и dev launcher
        run: python3 -m unittest tools.test_ci_scope tools.test_dev

      - name: Проверить dependency lock invariants
        shell: bash
        run: |
          set -euo pipefail
          # Force fresh uv.lock by removing cached version
          rm -f backend/uv.lock
          python3 -m unittest tools.test_dependency_locks
          python3 tools/check_dependency_locks.py

      - name: Определить затронутые области
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          changed_file="${RUNNER_TEMP}/changed-files.txt"
          : > "${changed_file}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            merge_base="$(git merge-base "${base_sha}" "${head_sha}")"
            git diff --name-only "${merge_base}" "${head_sha}" > "${changed_file}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > "${changed_file}"
          else
            git ls-files > "${changed_file}"
          fi

          python3 tools/ci_scope.py "${changed_file}" \
            --root "${GITHUB_WORKSPACE}" \
            --github-output "${GITHUB_OUTPUT}" \
            --summary "${GITHUB_STEP_SUMMARY}"

  backend:
    name: Backend — lint, types и unit/API tests
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          clean: true

      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Установить locked backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation ./backend

      - name: Ruff
        run: make lint-backend

      - name: Mypy
        run: make typecheck-backend

      - name: Pytest
        run: make test-backend

  frontend:
    name: Frontend — lint, types, unit, build
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          clean: true

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Установить зависимости
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit тесты
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  protocol:
    name: Protocol — проверка совместимости
    needs: scope
    if: needs.scope.outputs.protocol == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          clean: true

      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Установить зависимости
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements-dev.lock

      - name: Protocol тесты
        run: make test-protocol

  security:
    name: Security — проверка уязвимостей
    needs: scope
    if: needs.scope.outputs.security == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          clean: true

      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Установить зависимости
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements-dev.lock

      - name: Bandit
        run: make security-backend

      - name: Trivy
        run: make security-frontend

  integration:
    name: Integration — интеграционные тесты
    needs: [backend, frontend]
    if: needs.scope.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          clean: true

      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Установить зависимости
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements-dev.lock

      - name: Интеграционные тесты
        run: make test-integration

  compose:
    name: Compose — проверка docker-compose
    needs: scope
    if: needs.scope.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          clean: true

      - name: Docker Compose
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml build
          docker compose -f docker-compose.yml up -d
          sleep 10
          docker compose -f docker-compose.yml down

  docs:
    name: Docs — проверка документации
    needs: scope
    if: needs.scope.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          clean: true

      - name: Проверка ссылок
        run: make check-docs

  quality-gate:
    name: Quality Gate
    needs: [backend, frontend, protocol, security, integration, compose, docs]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          clean: true

      - name: Проверить результаты обязательных jobs
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "${SCOPE_RESULT}" \
            "${BACKEND_RESULT}" \
            "${FRONTEND_RESULT}" \
            "${WINDOWS_DEV_RESULT}" \
            "${PROTOCOL_RESULT}" \
            "${SECURITY_RESULT}" \
            "${INTEGRATION_RESULT}" \
            "${COMPOSE_RESULT}" \
            "${OFFLINE_INSTALL_RESULT}" \
            "${DOCS_RESULT}"; do
            case "${result}" in
              success|skipped)
                ;;
              *)
                echo "Обязательный CI job завершился со статусом: ${result}" >&2
                exit 1
                ;;
            esac
          done
          echo 'Все требуемые для этого diff проверки прошли.'
