name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Определение области изменений
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      protocol: ${{ steps.scope.outputs.protocol }}
      security: ${{ steps.scope.outputs.security }}
      integration: ${{ steps.scope.outputs.integration }}
      compose: ${{ steps.scope.outputs.compose }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          clean: true

      - name: Проверить regression scoped CI и dev launcher
        run: python3 -m unittest tools.test_ci_scope tools.test_dev

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.9"

      - name: Проверить dependency lock invariants
        shell: bash
        run: |
          set -euo pipefail
          # Verify the committed lock without replacing it.
          uv lock --check --directory backend
          python3 -m unittest tools.test_dependency_locks
          python3 tools/check_dependency_locks.py

      - name: Определить затронутые области
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          changed_file="${RUNNER_TEMP}/changed-files.txt"
          : > "${changed_file}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            merge_base="$(git merge-base "${base_sha}" "${head_sha}")"
            git diff --name-only "${merge_base}" "${head_sha}" > "${changed_file}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > "${changed_file}"
          else
            git ls-files > "${changed_file}"
          fi

          python3 tools/ci_scope.py "${changed_file}" \
            --root "${GITHUB_WORKSPACE}" \
            --github-output "${GITHUB_OUTPUT}" \
            --summary "${GITHUB_STEP_SUMMARY}"

  backend:
    name: Backend — lint, types и unit/API tests
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          clean: true

      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Установить locked backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation ./backend

      - name: Ruff
        run: make lint-backend

      - name: Mypy
        run: make typecheck-backend

      - name: Pytest
        run: make test-backend

  frontend:
    name: Frontend — lint, types, unit, build
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          clean: true

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit тесты
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  protocol:
    name: Protocol — проверка совместимости
    needs: scope
    if: needs.scope.outputs.protocol == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          clean: true

      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Установить зависимости
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements-dev.lock

      - name: Protocol тесты
        run: cd backend && python -m pytest tests/test_bundle_protocol.py tests/test_bundle_schema.py tests/test_bundle_package_service.py

  security:
    name: Security — проверка уязвимостей
    needs: scope
    if: needs.scope.outputs.security == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          clean: true

      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Установить зависимости
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements-dev.lock

      - name: Install Bandit
        run: python -m pip install bandit==1.8.6

      - name: Bandit - high and medium severity
        run: python -m bandit -q -r backend/app -ll

      - name: Trivy - filesystem vulnerability scan
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/workspace:ro" \
            aquasec/trivy:0.65.0 fs \
            --scanners vuln \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --format table \
            /workspace

  integration:
    name: Integration — интеграционные тесты
    needs: [scope, backend, frontend]
    if: ${{ always() && needs.scope.outputs.integration == 'true' && needs.backend.result == 'success' && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          clean: true

      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Установить зависимости
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements-dev.lock

      - name: Интеграционные тесты
        run: make test-registry-integration

  compose:
    name: Compose — проверка docker-compose
    needs: scope
    if: needs.scope.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          clean: true

      - name: Docker Compose
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml build
          trap 'docker compose -f compose.yaml down --volumes --remove-orphans' EXIT
          docker compose -f compose.yaml up -d --wait
          curl --fail --silent --show-error http://127.0.0.1:8080/api/health

  docs:
    name: Docs — проверка документации
    needs: scope
    if: needs.scope.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          clean: true

      - name: Проверка ссылок
        run: make docs-check

  quality-gate:
    name: Quality Gate
    needs: [scope, backend, frontend, protocol, security, integration, compose, docs]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Проверить результаты обязательных jobs
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PROTOCOL_RESULT: ${{ needs.protocol.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          BACKEND_REQUIRED: ${{ needs.scope.outputs.backend }}
          FRONTEND_REQUIRED: ${{ needs.scope.outputs.frontend }}
          PROTOCOL_REQUIRED: ${{ needs.scope.outputs.protocol }}
          SECURITY_REQUIRED: ${{ needs.scope.outputs.security }}
          INTEGRATION_REQUIRED: ${{ needs.scope.outputs.integration }}
          COMPOSE_REQUIRED: ${{ needs.scope.outputs.compose }}
          DOCS_REQUIRED: ${{ needs.scope.outputs.docs }}
        run: |
          set -euo pipefail
          [[ "$SCOPE_RESULT" == "success" ]] || { echo "Scope failed: $SCOPE_RESULT"; exit 1; }
          for area in BACKEND FRONTEND PROTOCOL SECURITY INTEGRATION COMPOSE DOCS; do
            result_key="${area}_RESULT"
            required_key="${area}_REQUIRED"
            result="${!result_key}"
            required="${!required_key}"
            if [[ "$required" == "true" && "$result" != "success" ]]; then
              echo "${area} required, but result is ${result}" >&2
              exit 1
            fi
            if [[ "$required" == "false" && "$result" != "skipped" && "$result" != "success" ]]; then
              echo "${area} unexpected result: ${result}" >&2
              exit 1
            fi
          done
          echo 'Все требуемые для этого diff проверки прошли.'
