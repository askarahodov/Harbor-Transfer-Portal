name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Определение области изменений
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      protocol: ${{ steps.scope.outputs.protocol }}
      security: ${{ steps.scope.outputs.security }}
      integration: ${{ steps.scope.outputs.integration }}
      compose: ${{ steps.scope.outputs.compose }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Проверить regression scoped CI
        run: python3 -m unittest tools.test_ci_scope

      - name: Проверить dependency lock invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tools.test_dependency_locks
          python3 tools/check_dependency_locks.py

      - name: Определить затронутые области
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          changed_file="${RUNNER_TEMP}/changed-files.txt"
          : > "${changed_file}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            merge_base="$(git merge-base "${base_sha}" "${head_sha}")"
            git diff --name-only "${merge_base}" "${head_sha}" > "${changed_file}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > "${changed_file}"
          else
            git ls-files > "${changed_file}"
          fi

          python3 tools/ci_scope.py "${changed_file}" \
            --root "${GITHUB_WORKSPACE}" \
            --github-output "${GITHUB_OUTPUT}" \
            --summary "${GITHUB_STEP_SUMMARY}"

  backend:
    name: Backend — lint, types и unit/API tests
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Установить locked backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation ./backend

      - name: Ruff
        run: make lint-backend

      - name: Mypy
        run: make typecheck-backend

      - name: Pytest
        run: make test-backend

  frontend:
    name: Frontend — lint, types, unit, build
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Установить locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck

      - name: Unit/component tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

  protocol:
    name: Bundle protocol — contract regression
    needs: scope
    if: needs.scope.outputs.protocol == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Установить locked backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation ./backend

      - name: Проверить Bundle Protocol v1
        working-directory: backend
        run: python -m pytest tests/test_bundle_protocol.py tests/test_bundle_schema.py tests/test_bundle_package_service.py tests/test_bundle_package_key_bounds.py

  security:
    name: Security — targeted regression
    needs: scope
    if: needs.scope.outputs.security == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Установить locked backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation ./backend

      - name: Проверить security-sensitive behavior
        working-directory: backend
        run: >-
          python -m pytest
          tests/test_auth.py
          tests/test_auth_api.py
          tests/test_login_rate_limit.py
          tests/test_user_admin_api.py
          tests/test_bundle_package_service.py
          tests/test_bundle_package_key_bounds.py
          tests/test_export_cancellation.py
          tests/test_export_orchestrator.py
          tests/test_export_publication_guard.py
          tests/test_export_recovery.py
          tests/test_exports_api.py
          tests/test_import_orchestrator.py
          tests/test_import_preview_projection.py
          tests/test_key_management_api.py
          tests/test_key_management_atomic_commit.py
          tests/test_key_management_hardening.py
          tests/test_skopeo_service.py
          tests/test_helm_oci_service.py
          tests/test_helm_oci_hardening.py
          tests/test_structured_logging.py

  integration:
    name: Integration — Skopeo/Helm local registry
    needs: scope
    if: needs.scope.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Проверить Skopeo/Helm через disposable registry
        run: make test-registry-integration

  compose:
    name: Compose — build и smoke
    needs: scope
    if: needs.scope.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Подготовить безопасную CI-конфигурацию
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          cat >> .env <<'EOF'
          JWT_SECRET=ci-only-secret-not-for-production-0123456789abcdef0123456789abcdef
          EOF

      - name: Compose smoke test
        run: sh deploy/smoke-compose.sh

  docs:
    name: Documentation — local links
    needs: scope
    if: needs.scope.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Проверить документацию
        run: make docs-check

  quality-gate:
    name: quality-gate
    if: always()
    needs: [scope, backend, frontend, protocol, security, integration, compose, docs]
    runs-on: ubuntu-24.04
    steps:
      - name: Проверить результаты обязательных jobs
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PROTOCOL_RESULT: ${{ needs.protocol.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          set -euo pipefail

          for result in \
            "${SCOPE_RESULT}" \
            "${BACKEND_RESULT}" \
            "${FRONTEND_RESULT}" \
            "${PROTOCOL_RESULT}" \
            "${SECURITY_RESULT}" \
            "${INTEGRATION_RESULT}" \
            "${COMPOSE_RESULT}" \
            "${DOCS_RESULT}"; do
            case "${result}" in
              success|skipped)
                ;;
              *)
                echo "Обязательный CI job завершился со статусом: ${result}" >&2
                exit 1
                ;;
            esac
          done

          echo 'Все требуемые для этого diff проверки прошли.'
