name: Nexus legacy Docker v2 E2E

on:
  pull_request:
    paths:
      - '.github/workflows/nexus-legacy-e2e.yml'
      - 'tools/nexus_e2e_setup.py'
      - 'backend/tests/test_nexus_legacy_e2e.py'
      - 'backend/tests/test_nexus_source_e2e.py'
      - 'backend/tests/test_nexus_target_e2e.py'
      - 'backend/tests/test_harbor_nexus_interop_e2e.py'
      - 'tools/harbor_e2e_setup.py'
      - 'backend/tests/test_nexus_helm_e2e.py'
      - 'backend/tests/test_nexus_helm_bundle_e2e.py'
      - 'backend/tests/test_nexus_regional_preflight_e2e.py'
      - 'backend/integration/nexus_regional_preflight.py'
      - 'backend/app/services/nexus_helm_http.py'
      - 'backend/app/services/nexus_destination_validator.py'
      - 'backend/app/services/import_destination_plan.py'
      - 'backend/app/services/export_orchestrator.py'
      - 'backend/app/services/export_artifact_materializer.py'
      - 'backend/app/services/bundle_package_service.py'
      - 'backend/app/domain/bundle.py'
      - 'backend/app/api/exports.py'
      - 'backend/app/api/registry_source.py'
      - 'backend/app/services/nexus_service.py'
      - 'backend/app/services/registry_client.py'
      - 'backend/requirements-dev.lock'
      - 'docs/nexus-setup.md'
  workflow_dispatch:
    inputs:
      nexus_version:
        description: 'Versioned pre-OCI Nexus 3 image (e.g. 3.69.0)'
        type: string
        required: true
        default: '3.69.0'

permissions:
  contents: read

concurrency:
  group: nexus-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-docker-v2:
    name: Nexus ${{ matrix.nexus_version }} — Docker v2 + Helm HTTP transport
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        nexus_version: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.nexus_version) || '["3.69.0","3.70.1"]') }}
    timeout-minutes: 35
    env:
      HTP_NEXUS_LEGACY_E2E: '1'
      HTP_HARBOR_COMPAT_E2E: '1'
      HTP_NEXUS_E2E_PASSWORD_FILE: /tmp/htp-nexus-admin-password
      HTP_NEXUS_TLS_CA_FILE: /tmp/htp-nexus-e2e-tls/server.crt
      HTP_NEXUS_HELM_HTTPS_URL: https://127.0.0.1:8444
      HTP_NEXUS_VERSION: ${{ matrix.nexus_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Install Skopeo and pinned backend test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation ./backend

      - name: Start isolated pre-OCI Nexus 3
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${HTP_NEXUS_VERSION}" =~ ^3\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Only versioned Nexus 3 tags are accepted" >&2
            exit 1
          fi
          minor="${HTP_NEXUS_VERSION#3.}"
          minor="${minor%%.*}"
          if (( minor >= 94 )); then
            echo "This workflow tests pre-OCI Nexus 3 only (<3.94)" >&2
            exit 1
          fi
          docker pull "sonatype/nexus3:${HTP_NEXUS_VERSION}"
          docker run --detach \
            --name htp-nexus-e2e \
            --memory 4g \
            -p 127.0.0.1:8081:8081 \
            -p 127.0.0.1:8082:8082 \
            -p 127.0.0.1:8083:8083 \
            -e INSTALL4J_ADD_VM_PARAMS="-Xms512m -Xmx2g -XX:MaxDirectMemorySize=1g" \
            "sonatype/nexus3:${HTP_NEXUS_VERSION}"

      - name: Configure legacy Docker hosted repository
        shell: bash
        run: |
          set -euo pipefail
          python tools/nexus_e2e_setup.py --password-file "${HTP_NEXUS_E2E_PASSWORD_FILE}"

      - name: Verify Nexus product build and OSS edition
        shell: bash
        run: |
          set -euo pipefail
          # Sonatype documents the Server header as the authoritative
          # "{version}-{build} ({edition})" identity for Nexus Repository.
          headers="$(curl --fail --silent --show-error --head http://127.0.0.1:8081/)"
          product="$(printf '%s\n' "${headers}" | tr -d '\r' | sed -n -E 's/^[Ss]erver:[[:space:]]*//p' | head -n 1)"
          echo "Nexus product identity: ${product}"
          if [[ "${HTP_NEXUS_VERSION}" == "3.69.0" ]]; then
            if [[ "${product}" != "Nexus/3.69.0-02 (OSS)" ]]; then
              echo "Expected exact regional baseline Nexus/3.69.0-02 (OSS)" >&2
              exit 1
            fi
          elif [[ "${product}" != "Nexus/${HTP_NEXUS_VERSION}-"* ]]; then
            echo "Pulled Nexus image does not match selected version" >&2
            exit 1
          fi

      - name: Start HTTPS reverse proxy with test-only self-signed CA
        shell: bash
        run: |
          set -euo pipefail
          tls_dir=/tmp/htp-nexus-e2e-tls
          mkdir -p "${tls_dir}"
          chmod 700 "${tls_dir}"
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout "${tls_dir}/server.key" -out "${tls_dir}/server.crt" \
            -subj "/CN=localhost" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost"
          chmod 600 "${tls_dir}/server.key"
          cat > "${tls_dir}/default.conf" <<'NGINX'
          server {
            listen 8443 ssl;
            server_name localhost;
            ssl_certificate /certs/server.crt;
            ssl_certificate_key /certs/server.key;
            location / {
              proxy_pass http://127.0.0.1:8082;
              proxy_http_version 1.1;
              proxy_set_header Host $http_host;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-Host $http_host;
            }
          }
          server {
            listen 8444 ssl;
            server_name localhost;
            ssl_certificate /certs/server.crt;
            ssl_certificate_key /certs/server.key;
            location / {
              proxy_pass http://127.0.0.1:8081;
              proxy_http_version 1.1;
              proxy_set_header Host $http_host;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-Host $http_host;
            }
          }
          NGINX
          docker run --detach --name htp-nexus-tls-proxy --network host \
            -v "${tls_dir}/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "${tls_dir}/server.crt:/certs/server.crt:ro" \
            -v "${tls_dir}/server.key:/certs/server.key:ro" \
            nginx:1.27.5-alpine
          for i in $(seq 1 20); do
            status=$(curl -sS --cacert "${tls_dir}/server.crt" \
              -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/v2/ || true)
            if [[ "${status}" == "401" || "${status}" == "200" ]]; then
              echo "HTTPS proxy to Docker Registry v2 is ready (HTTP ${status})"
              break
            fi
            if (( i == 20 )); then
              echo "HTTPS proxy did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Start isolated Harbor-compatible Docker Registry v2 fixture
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name htp-harbor-docker-fixture \
            -p 127.0.0.1:5005:5000 \
            --tmpfs /var/lib/registry \
            registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          for i in $(seq 1 30); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:5005/v2/ || true)
            if [[ "${status}" == "200" ]]; then
              break
            fi
            if (( i == 30 )); then
              echo "Docker distribution fixture not ready" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Real Nexus Docker v2 E2E tests (never OCI/Helm)
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m pytest -v -x tests/test_nexus_legacy_e2e.py tests/test_nexus_source_e2e.py tests/test_nexus_target_e2e.py tests/test_harbor_nexus_interop_e2e.py

      - name: Real classic Helm HTTP SOURCE/TARGET transport E2E (no OCI)
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m pytest -v -x tests/test_nexus_helm_e2e.py tests/test_nexus_helm_bundle_e2e.py tests/test_nexus_regional_preflight_e2e.py

      - name: Stop and delete disposable Nexus
        if: ${{ always() }}
        shell: bash
        run: |
          docker rm -f htp-nexus-tls-proxy 2>/dev/null || true
          docker rm -f htp-harbor-docker-fixture 2>/dev/null || true
          docker stop --time=120 htp-nexus-e2e 2>/dev/null || true
          docker rm -f htp-nexus-e2e 2>/dev/null || true
          rm -f "${HTP_NEXUS_E2E_PASSWORD_FILE}"
          rm -rf /tmp/htp-nexus-e2e-tls

  real-harbor-core-nexus:
    name: Harbor 2.14.6 Core + robots ↔ Nexus 3.69.0
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HTP_NEXUS_LEGACY_E2E: '1'
      HTP_REAL_HARBOR_E2E: '1'
      HTP_REAL_HARBOR_URL: https://htp-harbor.test:9443
      HTP_REAL_HARBOR_CA_FILE: /tmp/htp-real-harbor/certs/server.crt
      HTP_REAL_HARBOR_SKOPEO_CERT_DIR: /tmp/htp-real-harbor/certs/skopeo
      HTP_HARBOR_ADMIN_PASSWORD_FILE: /tmp/htp-real-harbor/admin.password
      HTP_HARBOR_SOURCE_ROBOT_FILE: /tmp/htp-real-harbor/source-robot.json
      HTP_HARBOR_TARGET_ROBOT_FILE: /tmp/htp-real-harbor/target-robot.json
      HTP_NEXUS_E2E_PASSWORD_FILE: /tmp/htp-nexus-admin-password
      NO_PROXY: 127.0.0.1,localhost,htp-harbor.test
      no_proxy: 127.0.0.1,localhost,htp-harbor.test

    steps:
      - name: Run minimal smoke
        run: echo "ok"
