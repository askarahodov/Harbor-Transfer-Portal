name: Nexus legacy Docker v2 E2E

on:
  pull_request:
    paths:
      - '.github/workflows/nexus-legacy-e2e.yml'
      - 'tools/nexus_e2e_setup.py'
      - 'backend/tests/test_nexus_legacy_e2e.py'
      - 'backend/app/services/nexus_service.py'
      - 'backend/app/services/registry_client.py'
      - 'backend/requirements-dev.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-docker-v2:
    name: Nexus 3.70.1 — actual Docker v2 transport
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HTP_NEXUS_LEGACY_E2E: '1'
      HTP_NEXUS_E2E_PASSWORD_FILE: /tmp/htp-nexus-admin-password
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Install Skopeo and pinned backend test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation ./backend

      - name: Start isolated pre-OCI Nexus 3
        shell: bash
        run: |
          set -euo pipefail
          docker pull sonatype/nexus3:3.70.1
          docker run --detach \
            --name htp-nexus-e2e \
            --memory 4g \
            -p 127.0.0.1:8081:8081 \
            -p 127.0.0.1:8082:8082 \
            -e INSTALL4J_ADD_VM_PARAMS="-Xms512m -Xmx2g -XX:MaxDirectMemorySize=1g" \
            sonatype/nexus3:3.70.1

      - name: Configure legacy Docker hosted repository
        shell: bash
        run: |
          set -euo pipefail
          python tools/nexus_e2e_setup.py --password-file "${HTP_NEXUS_E2E_PASSWORD_FILE}"

      - name: Real Nexus Docker v2 E2E tests (never OCI/Helm)
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m pytest -v -x tests/test_nexus_legacy_e2e.py

      - name: Stop and delete disposable Nexus
        if: ${{ always() }}
        shell: bash
        run: |
          docker stop --time=120 htp-nexus-e2e 2>/dev/null || true
          docker rm -f htp-nexus-e2e 2>/dev/null || true
          rm -f "${HTP_NEXUS_E2E_PASSWORD_FILE}"
