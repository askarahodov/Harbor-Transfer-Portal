name: Fix vulnerable frontend dependency locks
on:
  push:
    branches: [fix/review-2026-11-03-ci-nexus]
permissions:
  contents: write
jobs:
  upgrade-patched-deps:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-2026-11-03-ci-nexus
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate frontend lock with patched transitive dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'overrides.follow-redirects=1.16.2'
          npm pkg set 'overrides.source-map-js=1.2.2'
          npm install --package-lock-only --ignore-scripts --no-audit
          npm ci --ignore-scripts
          npm ls follow-redirects source-map-js
      - name: Commit generated dependency locks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(deps): override vulnerable frontend transitive packages'
            git push origin HEAD:fix/review-2026-11-03-ci-nexus
          fi
