name: One-time cleanup of three reviewed refs (#513)

on:
  pull_request:
    paths:
      - .github/workflows/prune-three-reviewed-refs-once.yml
      - tools/prune_three_reviewed_refs.py
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-three-reviewed-refs-once.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: issue-513-three-reviewed-refs
  cancel-in-progress: false

jobs:
  safe-prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Verify script syntax
        run: python3 -m py_compile tools/prune_three_reviewed_refs.py

      - name: Preflight all three refs and PR provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/prune_three_reviewed_refs.py

      - name: Delete only after approved merge into main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_PRUNE_ENABLE: issue-513-three-reviewed-refs
        run: python3 tools/prune_three_reviewed_refs.py --apply

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "Issue #513 — three exact, reviewed redundant refs" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "PR dry-run only; no refs deleted." >> "$GITHUB_STEP_SUMMARY"
          fi
