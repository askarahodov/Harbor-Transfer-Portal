name: One-time superseded branch cleanup (#513)

on:
  pull_request:
    paths:
      - .github/workflows/prune-superseded-once.yml
      - tools/superseded-branch-prune.tsv
      - tools/prune_superseded_refs.py
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-superseded-once.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: superseded-branch-cleanup-513
  cancel-in-progress: false

jobs:
  audit-and-prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Check script syntax
        run: python3 -m py_compile tools/prune_superseded_refs.py
      - name: Verify closed and successor PRs with exact branch SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/prune_superseded_refs.py
      - name: Delete ten superseded refs only after successful preflight
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_PRUNE_ENABLE: issue-513-superseded-10
        run: python3 tools/prune_superseded_refs.py --apply
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "Issue #513 — ten unmerged PRs explicitly superseded by main-merged PRs" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "Dry-run only; no refs deleted." >> "$GITHUB_STEP_SUMMARY"
          fi
