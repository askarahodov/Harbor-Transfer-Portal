server {
    listen ${PORTAL_HTTP_BIND}:${PORTAL_HTTP_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Backend transfer policy is authoritative. Do not impose a smaller
        # frontend proxy body limit on streamed browser bundle uploads.
        client_max_body_size 0;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Browser transport security is declared by trusted PORTAL_BROWSER_SCHEME.
        # Never forward a client-supplied X-Forwarded-Proto across this boundary.
        proxy_set_header X-Forwarded-Proto "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
