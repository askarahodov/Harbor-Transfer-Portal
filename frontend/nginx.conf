server {
    listen 0.0.0.0:8080;
    server_name _;

    # Browser uploads are streamed to the backend, which enforces the authoritative
    # import_max_upload_bytes policy. Do not keep a smaller hidden Nginx body limit.
    client_max_body_size 0;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Browser transport security is declared by trusted PORTAL_BROWSER_SCHEME.
        # Never forward a client-supplied X-Forwarded-Proto across this boundary.
        proxy_set_header X-Forwarded-Proto "";
        proxy_connect_timeout 5s;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
