services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        RELEASE_VERSION: ${PORTAL_VERSION:-dev}
        VCS_REF: ${PORTAL_VCS_REF:-unknown}
        SKOPEO_DEBIAN_VERSION: 1.9.3+ds1-1+b10
        HELM_VERSION: v3.22.0
    image: harbor-transfer-portal-backend:${PORTAL_VERSION:-dev}
    env_file:
      - .env
    environment:
      PORTAL_CONTOUR: ${PORTAL_CONTOUR:-SOURCE}
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    volumes:
      - portal-data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "${PORTAL_LOG_MAX_SIZE:-10m}"
        max-file: "${PORTAL_LOG_MAX_FILES:-5}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        RELEASE_VERSION: ${PORTAL_VERSION:-dev}
        VCS_REF: ${PORTAL_VCS_REF:-unknown}
    image: harbor-transfer-portal-frontend:${PORTAL_VERSION:-dev}
    environment:
      PORTAL_CONTOUR: ${PORTAL_CONTOUR:-SOURCE}
    ports:
      - "${PORTAL_HTTP_BIND:-127.0.0.1}:${PORTAL_HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "${PORTAL_LOG_MAX_SIZE:-10m}"
        max-file: "${PORTAL_LOG_MAX_FILES:-5}"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:8080/healthz"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  portal-data:
