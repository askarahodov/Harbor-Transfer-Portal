<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Локальная документация Harbor Transfer Portal" />
    <title>Harbor Transfer Portal — Документация</title>
    <link rel="stylesheet" href="/docs/_portal/tokens.css" />
    <link rel="stylesheet" href="/docs/_vendor/core.min.css" />
    <link rel="stylesheet" href="/docs/portal-docs.css" />
  </head>
  <body>
    <header class="docs-topbar">
      <a class="docs-brand" href="/" aria-label="Harbor Transfer Portal — открыть портал">
        <span class="docs-brand__mark" aria-hidden="true">HT</span>
        <span class="docs-brand__name">Harbor Transfer Portal</span>
      </a>
      <div class="docs-context" aria-live="polite">
        <span class="docs-context__section">Документация</span>
        <span class="docs-context__separator" aria-hidden="true">/</span>
        <span id="docs-page-title" class="docs-context__page">Карта документации</span>
      </div>
      <a class="docs-portal-link" href="/">Назад в портал</a>
    </header>

    <div id="app">Загрузка документации…</div>

    <aside id="docs-page-toc" class="docs-page-toc" aria-label="Навигация по текущей странице" hidden>
      <div class="docs-page-toc__card">
        <div class="docs-page-toc__title">На этой странице</div>
        <nav aria-label="Разделы текущего документа">
          <ul id="docs-page-toc-list" class="docs-page-toc__list"></ul>
        </nav>
      </div>
    </aside>

    <script>
      function currentDocsRoute() {
        var hash = window.location.hash || '#/'
        return hash.split('?')[0]
      }

      function docsifySectionHref(id) {
        return currentDocsRoute() + '?id=' + encodeURIComponent(id)
      }

      function headingLabel(heading) {
        return (heading.dataset.docsTitle || heading.textContent || '').trim()
      }

      function decorateHeadings() {
        var headings = document.querySelectorAll('.markdown-section h2, .markdown-section h3')

        headings.forEach(function (heading) {
          if (!heading.id) return

          if (!heading.dataset.docsTitle) {
            heading.dataset.docsTitle = (heading.textContent || '').trim()
          }

          var existing = heading.querySelector('.docs-heading-anchor')
          if (existing) {
            existing.setAttribute('href', docsifySectionHref(heading.id))
            return
          }

          var anchor = document.createElement('a')
          anchor.className = 'docs-heading-anchor'
          anchor.setAttribute('href', docsifySectionHref(heading.id))
          anchor.setAttribute('aria-label', 'Ссылка на раздел: ' + headingLabel(heading))
          anchor.setAttribute('title', 'Ссылка на раздел')
          anchor.textContent = '#'
          heading.appendChild(anchor)
        })
      }

      function updatePageTitle() {
        var target = document.getElementById('docs-page-title')
        var heading = document.querySelector('.markdown-section h1')
        if (!target) return
        target.textContent = heading ? (heading.textContent || '').trim() : 'Документация'
      }

      function mountPageToc() {
        var content = document.querySelector('.content')
        var toc = document.getElementById('docs-page-toc')
        if (!content || !toc) return

        if (toc.parentElement !== content) {
          content.appendChild(toc)
        }
      }

      function renderPageToc() {
        var toc = document.getElementById('docs-page-toc')
        var list = document.getElementById('docs-page-toc-list')
        if (!toc || !list) return

        var headings = Array.prototype.slice.call(
          document.querySelectorAll('.markdown-section h2, .markdown-section h3'),
        )

        list.replaceChildren()

        if (!headings.length) {
          toc.hidden = true
          return
        }

        headings.forEach(function (heading) {
          if (!heading.id) return

          var item = document.createElement('li')
          item.className =
            'docs-page-toc__item docs-page-toc__item--' + heading.tagName.toLowerCase()

          var link = document.createElement('a')
          link.setAttribute('href', docsifySectionHref(heading.id))
          link.textContent = headingLabel(heading)

          item.appendChild(link)
          list.appendChild(item)
        })

        toc.hidden = list.children.length === 0
      }

      var docsSidebarStateKey = 'htp.docs.sidebar.groups.v1'

      function readSidebarGroupState() {
        try {
          return JSON.parse(window.localStorage.getItem(docsSidebarStateKey) || '{}')
        } catch (error) {
          return {}
        }
      }

      function writeSidebarGroupState(state) {
        try {
          window.localStorage.setItem(docsSidebarStateKey, JSON.stringify(state))
        } catch (error) {
          // Local UI persistence is optional; navigation must still work without storage.
        }
      }

      function directChild(element, predicate) {
        return Array.prototype.find.call(element.children || [], predicate)
      }

      function sidebarGroupLabel(group) {
        var directStrong = directChild(group, function (child) {
          return child.tagName === 'STRONG'
        })
        if (directStrong) return { node: directStrong, container: directStrong }

        var paragraph = directChild(group, function (child) {
          return child.tagName === 'P'
        })
        if (!paragraph) return null

        var strong = directChild(paragraph, function (child) {
          return child.tagName === 'STRONG'
        })
        return strong ? { node: strong, container: paragraph } : null
      }

      function setSidebarGroupOpen(group, list, button, open) {
        list.hidden = !open
        group.classList.toggle('docs-sidebar-group--open', open)
        button.setAttribute('aria-expanded', open ? 'true' : 'false')
      }

      function enhanceSidebarGroups() {
        var root = document.querySelector('.sidebar-nav > ul')
        if (!root) return

        var storedState = readSidebarGroupState()
        var groups = Array.prototype.slice.call(root.children || []).filter(function (child) {
          return child.tagName === 'LI'
        })

        groups.forEach(function (group, index) {
          var list = directChild(group, function (child) {
            return child.tagName === 'UL'
          })
          var label = sidebarGroupLabel(group)
          if (!list || !label) return

          var groupName = (label.node.textContent || '').trim()
          if (!groupName) return

          var active = Boolean(group.querySelector('li.active, a.active')) || group.classList.contains('active')
          var listId = 'docs-sidebar-group-' + index
          list.id = listId
          list.classList.add('docs-sidebar-group-list')
          label.container.hidden = true

          var button = directChild(group, function (child) {
            return child.classList && child.classList.contains('docs-sidebar-group-toggle')
          })

          if (!button) {
            button = document.createElement('button')
            button.type = 'button'
            button.className = 'docs-sidebar-group-toggle'
            button.setAttribute('aria-controls', listId)

            var title = document.createElement('span')
            title.className = 'docs-sidebar-group-toggle__title'
            title.textContent = groupName

            var chevron = document.createElement('span')
            chevron.className = 'docs-sidebar-group-toggle__chevron'
            chevron.setAttribute('aria-hidden', 'true')
            chevron.textContent = '›'

            button.appendChild(title)
            button.appendChild(chevron)
            group.insertBefore(button, list)

            button.addEventListener('click', function () {
              var containsActive =
                Boolean(group.querySelector('li.active, a.active')) || group.classList.contains('active')
              var expanded = button.getAttribute('aria-expanded') === 'true'

              if (containsActive && expanded) return

              var nextOpen = !expanded
              setSidebarGroupOpen(group, list, button, nextOpen)

              var state = readSidebarGroupState()
              state[groupName] = nextOpen
              writeSidebarGroupState(state)
            })
          }

          var open = active || storedState[groupName] === true
          setSidebarGroupOpen(group, list, button, open)
        })
      }

      window.$docsify = {
        name: 'Harbor Transfer Portal',
        homepage: '/docs/README.md',
        basePath: '/',
        routerMode: 'hash',
        loadSidebar: true,
        alias: {
          '/_sidebar.md': '/docs/_sidebar.md',
          '/.*/_sidebar.md': '/docs/_sidebar.md',
        },
        auto2top: true,
        skipLink: 'Перейти к содержимому',
        relativePath: true,
        notFoundPage: '/docs/_404.md',
        maxLevel: 3,
        subMaxLevel: 0,
        search: {
          paths: 'auto',
          placeholder: 'Поиск по документации',
          noData: 'Ничего не найдено',
          depth: 4,
        },
        copyCode: {
          buttonText: 'Копировать',
          errorText: 'Ошибка копирования',
          successText: 'Скопировано',
        },
        pagination: {
          previousText: 'Предыдущая',
          nextText: 'Следующая',
          crossChapter: true,
          crossChapterText: false,
        },
        plugins: [
          function (hook) {
            hook.doneEach(function () {
              window.requestAnimationFrame(function () {
                enhanceSidebarGroups()
                decorateHeadings()
                updatePageTitle()
                mountPageToc()
                renderPageToc()
              })
            })
          },
        ],
      }
    </script>
    <script src="/docs/_vendor/docsify.min.js"></script>
    <script src="/docs/_vendor/prism-bash.min.js"></script>
    <script src="/docs/_vendor/prism-batch.min.js"></script>
    <script src="/docs/_vendor/prism-powershell.min.js"></script>
    <script src="/docs/_vendor/prism-docker.min.js"></script>
    <script src="/docs/_vendor/prism-json.min.js"></script>
    <script src="/docs/_vendor/prism-yaml.min.js"></script>
    <script src="/docs/_vendor/prism-python.min.js"></script>
    <script src="/docs/_vendor/prism-sql.min.js"></script>
    <script>
      if (window.Prism) {
        if (Prism.languages.batch) Prism.languages.bat = Prism.languages.batch
        if (Prism.languages.bash) {
          Prism.languages.sh = Prism.languages.bash
          Prism.languages.shell = Prism.languages.bash
        }
        if (Prism.languages.docker) Prism.languages.dockerfile = Prism.languages.docker
      }
    </script>
    <script src="/docs/_vendor/search.min.js"></script>
    <script src="/docs/_vendor/docsify-copy-code.min.js"></script>
    <script src="/docs/_vendor/docsify-pagination.min.js"></script>
  </body>
</html>
